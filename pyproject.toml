[project]
name = "pdfeditor"
version = "0.2.1"
description = "Free, open-source Windows PDF editor: fill forms, add text and stamps, sign."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.9,<6.12",
    "fonttools>=4.50",
    "pymupdf>=1.26,<1.29",
]

[project.urls]
Homepage = "https://github.com/cor3nt1nn/pdf-editor"
Source = "https://github.com/cor3nt1nn/pdf-editor"
Issues = "https://github.com/cor3nt1nn/pdf-editor/issues"
Releases = "https://github.com/cor3nt1nn/pdf-editor/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.5",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "pypdf>=5",
    "cryptography>=42",
]

[project.scripts]
pdfeditor = "pdfeditor.app:main"

[project.gui-scripts]
pdfeditor-gui = "pdfeditor.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfeditor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "frozen: tests of the PyInstaller build (skipped unless PDFEDITOR_FROZEN_EXE is set)",
    "installer: tests of the setup program (skipped unless PDFEDITOR_INSTALLER is set)",
]
